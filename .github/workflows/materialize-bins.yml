name: materialize-bins
on:
  push:
    paths:
      - "firmware/payload/**"
      - ".github/workflows/materialize-bins.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode firmware bins and commit
        run: |
          set -euo pipefail
          if [ ! -f firmware/payload/_chunks/08.16 ]; then
            echo "Pebble chunks incomplete; skip"
            exit 0
          fi
          python3 <<'PY'
          import base64, hashlib, pathlib, sys
          root = pathlib.Path("firmware/payload/_chunks")
          parts = []
          for si in range(9):
              files = sorted(root.glob(f"{si:02d}.*"))
              if not files:
                  print("missing shard", si, file=sys.stderr)
                  sys.exit(1)
              blob = "".join(p.read_text(encoding="ascii") for p in files)
              print(f"shard {si:02d} files={len(files)} len={len(blob)}")
              parts.append(blob)
          b64 = "".join(parts)
          if len(b64) != 1027712:
              raise SystemExit(f"b64 len {len(b64)} != 1027712")
          pebble = base64.b64decode(b64)
          boot = base64.b64decode(pathlib.Path("firmware/payload/bootloader.bin.b64").read_text(encoding="ascii"))
          part = base64.b64decode(pathlib.Path("firmware/payload/partition-table.bin.b64").read_text(encoding="ascii"))
          expect = {
              "bootloader.bin": ("6e27e9fdae28695d2e63d8896f4dc3e6809b91fd3eb5528955b9b19c396eac40", boot),
              "partition-table.bin": ("d55f770ce72c56f7766b761b56fd8783349e9620de179646fc9d1cdf8f5e7280", part),
              "conner_pebble.bin": ("7f3303e91923bb1e7f2e1c948757b3873e24b5f8ea17cc1890fde559ddb13eeb", pebble),
          }
          out = pathlib.Path("firmware")
          for name, (hx, data) in expect.items():
              got = hashlib.sha256(data).hexdigest()
              if got != hx:
                  raise SystemExit(f"hash mismatch {name}: {got} != {hx}")
              (out / name).write_bytes(data)
              print(name, len(data), got)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/bootloader.bin firmware/partition-table.bin firmware/conner_pebble.bin
          git rm -f firmware/_bin_test.bin || true
          git rm -rf firmware/payload || true
          git commit -m "Add ESP32-S3 flash binaries for Conner pebble v1"
          git push
