name: materialize-bins
on:
  push:
    paths:
      - "firmware/payload/**"
      - ".github/workflows/materialize-bins.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble payload shards
        run: |
          set -euo pipefail
          if [ ! -f firmware/payload/_chunks/READY ]; then
            echo "Chunks not ready; skip"
            exit 0
          fi
          mkdir -p firmware/payload
          for i in 00 01 02 03 04 05 06 07 08; do
            cat firmware/payload/_chunks/${i}.* > firmware/payload/conner_pebble.bin.b64.${i}
          done
          python3 <<'PY'
          import hashlib, pathlib
          e={
            "firmware/payload/conner_pebble.bin.b64.00":"92f1f8f7c40c8af13d3e597af1001fc7a4ee978a",
            "firmware/payload/conner_pebble.bin.b64.01":"699c146b10f87217b6e0882e73a7fb2098f114a1",
            "firmware/payload/conner_pebble.bin.b64.02":"38b6522cf7e0c562734c54ccb6a4c388a6d8367b",
            "firmware/payload/conner_pebble.bin.b64.03":"2adca436f05f588c45ce05a799154d0afbd8c01a",
            "firmware/payload/conner_pebble.bin.b64.04":"3d6208b8f38b395fc0b133830e4b570768dd0005",
            "firmware/payload/conner_pebble.bin.b64.05":"ca9edf3a2774b48a2ba29c61c3e3063b77a38302",
            "firmware/payload/conner_pebble.bin.b64.06":"18757ea91e3b34432b1b1781233c626be1d97985",
            "firmware/payload/conner_pebble.bin.b64.07":"2ebbfce726a604d9fd90f9ca2a1817beb9561367",
            "firmware/payload/conner_pebble.bin.b64.08":"171a5d4d93de6b1bdb8fabb6fab5945e56656403",
          }
          for p,d in e.items():
            data=pathlib.Path(p).read_bytes()
            g=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
            print(p, len(data), g)
            assert g==d, p
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/payload/conner_pebble.bin.b64.00 firmware/payload/conner_pebble.bin.b64.01 firmware/payload/conner_pebble.bin.b64.02 firmware/payload/conner_pebble.bin.b64.03 firmware/payload/conner_pebble.bin.b64.04 firmware/payload/conner_pebble.bin.b64.05 firmware/payload/conner_pebble.bin.b64.06 firmware/payload/conner_pebble.bin.b64.07 firmware/payload/conner_pebble.bin.b64.08
          git rm -rf firmware/payload/_chunks
          git commit -m "Assemble firmware/payload conner_pebble shards"
          git push
